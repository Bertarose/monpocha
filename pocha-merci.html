<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POCHA MTL 2026 — Merci !</title>
<meta name="description" content="Merci d'avoir participé à POCHA MTL 2026 ! On se voit l'année prochaine. Le pojangmacha coréen de Montréal.">
<meta name="theme-color" content="#0A8FFF">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;height:100dvh;overflow:hidden;}
  body{
    font-family:'DM Sans',-apple-system,sans-serif;
    background:#0A8FFF;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;padding:16px;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at 20% 20%,rgba(255,255,255,.18) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 80%,rgba(10,25,41,.12) 0%,transparent 50%),
      linear-gradient(135deg,#0A8FFF 0%,#3FA9FF 30%,#0A8FFF 60%,#0876D4 100%);
    background-size:200% 200%;animation:gs 8s ease infinite;z-index:0;
  }
  @keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .petals{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal{position:absolute;border-radius:50%;animation:pd linear infinite;}
  @keyframes pd{0%{transform:translateY(-5vh) translateX(0);opacity:.6}50%{transform:translateY(50vh) translateX(24px);opacity:.35}100%{transform:translateY(105vh) translateX(-10px);opacity:0}}
  .sparkle{position:fixed;width:4px;height:4px;border-radius:50%;background:#fff;pointer-events:none;z-index:2;animation:tw ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.5)}}

  .c{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:420px;width:100%;}
  .cat{width:120px;height:120px;border-radius:26px;animation:cf 3s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(10,25,41,.25));margin-bottom:16px;}
  @keyframes cf{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
  .t0{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.8;margin-bottom:10px;}
  .merci{font-size:clamp(48px,15vw,80px);font-weight:900;letter-spacing:-.03em;line-height:.92;color:#FF4D00;text-shadow:0 3px 20px rgba(10,25,41,.2);}
  .t1{font-size:clamp(24px,7vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1;margin-top:8px;color:#fff;}
  .tg{font-size:15px;font-weight:500;opacity:.85;line-height:1.5;margin:16px 0 4px;max-width:340px;}
  .tg strong{font-weight:700;opacity:1;}
  .next{display:inline-block;margin:18px 0 20px;background:#FF4D00;color:#fff;font-size:14px;font-weight:800;letter-spacing:.03em;padding:12px 22px;border-radius:50px;}

  .btns{display:flex;gap:8px;width:100%;margin-bottom:14px;}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:none;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .15s;-webkit-tap-highlight-color:transparent;}
  .btn:active{transform:scale(.97);}
  .bp{background:#FF4D00;color:#fff;}
  .bs{background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);color:#fff;}

  .social{display:flex;gap:10px;}
  .social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .15s;}
  .social a:active{transform:scale(.9);}
  .ft{margin-top:14px;font-size:11px;opacity:.5;font-weight:500;}
  .ft a{color:#fff;}
  .lang{position:fixed;top:14px;right:14px;z-index:20;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.4);color:#fff;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.08em;padding:8px 14px;border-radius:50px;cursor:pointer;}
</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="petals" id="petals"></div>
<div class="c">
  <img class="cat" src="/icon-512.png" alt="POCHA MTL" width="120" height="120">
  <div class="t0" data-fr="Le pojangmacha coréen de Montréal" data-en="Montreal's Korean pojangmacha">Le pojangmacha coréen de Montréal</div>
  <div class="merci" data-fr="Merci !" data-en="Thank you!">Merci !</div>
  <div class="t1" data-fr="POCHA MTL 2026" data-en="POCHA MTL 2026">POCHA MTL 2026</div>
  <div class="tg" data-fr="Merci d'avoir participé à cette édition ! Vous avez rendu ces soirées inoubliables." data-en="Thank you for joining this edition! You made these nights unforgettable.">Merci d'avoir participé à cette édition ! Vous avez rendu ces soirées inoubliables.</div>
  <div class="next" data-fr="✦ On se voit l'année prochaine ✦" data-en="✦ See you next year ✦">✦ On se voit l'année prochaine ✦</div>
  <div class="btns">
    <a href="https://www.instagram.com/pochamtl" target="_blank" class="btn bp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="#fff"/></svg><span data-fr="Suivez-nous" data-en="Follow us">Suivez-nous</span></a>
    <a href="https://www.asiasie.com" target="_blank" class="btn bs"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg><span data-fr="Site web" data-en="Website">Site web</span></a>
  </div>
  <div class="social">
    <a href="https://www.facebook.com/asiasiemtl" target="_blank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></a>
    <a href="https://www.instagram.com/pochamtl" target="_blank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="#fff"/></svg></a>
  </div>
  <div class="ft">Un projet de <a href="https://www.asiasie.com" target="_blank">Asiasie</a></div>
</div>
<script>
let lang=localStorage.getItem('pocha_lang')||'fr';
function toggleLang(){lang=lang==='fr'?'en':'fr';localStorage.setItem('pocha_lang',lang);applyLang();}
function applyLang(){document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='fr'?'EN':'FR';document.querySelectorAll('[data-fr]').forEach(el=>el.textContent=el.dataset[lang]);}
applyLang();
(function(){var b=document.getElementById('petals');var cols=['rgba(255,255,255,','rgba(255,77,0,'];for(var i=0;i<24;i++){var p=document.createElement('div');p.className='petal';var s=7+Math.random()*13;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*-20+'%';p.style.background=cols[Math.random()>.65?1:0]+(0.3+Math.random()*.4)+')';p.style.animationDuration=(6+Math.random()*8)+'s';p.style.animationDelay=(Math.random()*5)+'s';b.appendChild(p);}for(var j=0;j<15;j++){var s=document.createElement('div');s.className='sparkle';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=(1.5+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*4)+'s';document.body.appendChild(s);}})();
</script>
</body>
</html>
